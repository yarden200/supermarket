spring.application.name=customer-service
server.port=8082

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${CUSTOMER_DB_NAME}
spring.datasource.username=${CUSTOMER_DB_USER}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# JWT
app.jwt.secret=${JWT_SECRET}