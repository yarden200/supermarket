---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: supermarket
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: supermarket-auth-service:latest
          imagePullPolicy: Never  # use local image (no registry push)
          ports: [{ containerPort: 8085 }]
          env:
            - name: DB_HOST
              value: postgres
            - name: AUTH_DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
            - name: AUTH_DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: AUTH_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secret, key: JWT_SECRET } }
            - name: SEED_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secret, key: SEED_ADMIN_PASSWORD } }
            - name: SEED_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secret, key: SEED_USER_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: supermarket
spec:
  selector: { app: auth-service }
  ports:
    - port: 8085
      targetPort: 8085