spring.application.name=auth-service
server.port=8085

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${AUTH_DB_NAME}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Seed users
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.user-password=${SEED_USER_PASSWORD}

# Cookie
app.cookie.secure=${COOKIE_SECURE:false}