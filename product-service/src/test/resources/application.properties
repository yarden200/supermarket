spring.application.name=product-service

# In-memory database instead of Postgres
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

app.jwt.secret=test-secret-for-product-service-tests-0123456789

# Kafka is not running in tests: don't create topics, don't wait long on send
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=100
app.kafka.topics.product-events=product-events

services.image.url=http://localhost:8084