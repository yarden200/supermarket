spring.application.name=product-service
server.port=8080

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${PRODUCT_DB_NAME}
spring.datasource.username=${PRODUCT_DB_USER}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100