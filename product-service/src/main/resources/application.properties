spring.application.name=product-service
server.port=8080

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${PRODUCT_DB_NAME}
spring.datasource.username=${PRODUCT_DB_USER}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# JWT
app.jwt.secret=${JWT_SECRET}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
app.kafka.topics.product-events=product-events

# Image service
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
services.image.url=http://localhost:8084