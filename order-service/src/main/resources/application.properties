spring.application.name=order-service
server.port=8081

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${ORDER_DB_NAME}
spring.datasource.username=${ORDER_DB_USER}
spring.datasource.password=${ORDER_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100