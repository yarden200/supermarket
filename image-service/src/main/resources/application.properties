spring.application.name=image-service
server.port=8084
spring.config.import=optional:file:.env[.properties]

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# S3 / LocalStack
app.s3.region=${AWS_REGION}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}
app.s3.bucket=${S3_BUCKET}
app.s3.endpoint=${S3_ENDPOINT:}
# Host used inside presigned URLs (empty = same as endpoint).
app.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:}
app.s3.presigned-url-minutes=15

# JWT
app.jwt.secret=${JWT_SECRET}

spring.mvc.problemdetails.enabled=true