spring.application.name=api-gateway
server.port=8000

# Load secrets from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

# Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=customer-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CUSTOMER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/customers/**

# JWT
app.jwt.secret=${JWT_SECRET}